# Sod shock tube using the hydrodynamics solver.
# Every application option except help and configuration; radius alternatives are commented.
# Each [group] key corresponds to --group.key; command-line values override the same key.
# Radius precedence across CLI/INI: effectiveRadius > softening alias > supportRadius.
# Ignored explicit radius settings produce warnings. Empty string defaults are blank.
# Set compute.cuda=false for CPU execution.
# Floating-point values retain source precision beyond the rounded help display.
# Initial left/right densities are 1 and 0.125; pressures are 1 and 0.1.
# Default duration is 0.09 code time units.

[run]
verbose = false # print full resolved options and detailed runtime diagnostics
endTime = 0.0 # total duration in code time units; 0 uses the scenario default
scenario = sod # physical scenario name
test =  # developer regression name; physical simulations use run.scenario
maxIterations = 1000000 # maximum number of time steps
numberOfSteps = 20 # total synchronized coarse intervals across the scenario
minRung = 0 # minimum starting rung
# Force-test-only tree reuse control; ignored unless run.test=force.
# 0 rebuilds the tree at each kick angle from 0.2 to 0.95 (step 0.05).
# A positive value <= 0.95 builds once there and sweeps kick angles up to 0.95 (step 0.025).
treeOpeningAngle = 0.0 # does not enable or disable FMM

[compute]
cudaKickFineHandoffBlocks = 0 # handoff divisor for nodes without Ewald checks; 0 retains cudaKickHandoffBlocks
cuda = true # use CUDA
bucketSize = 128 # gravity tree leaf bucket size
sphBucketSize = 0 # SPH leaf limit; 0 uses floor(8/pi * hydro.neighborNumber), 106 for 42 neighbors
cudaKickResidency = 0 # resident CUDA kick blocks per multiprocessor; 0 uses the register limit
cudaKickSinkTile = 0 # CUDA kick shared sink-force tile; 0 automatic, -1 global force storage
cudaKickParticleTile = 0 # CUDA kick staged particle sources per tile; 0 automatic
cudaKickMultipoleTile = 0 # CUDA kick staged multipoles per tile; 0 automatic
cudaKickSharedExpansion = true # keep the active CUDA kick local expansion in shared memory
cudaKickHandoffBlocks = 0 # CUDA block count dividing the particles for the CPU/GPU handoff threshold; 0 derives it from the particle count
cudaKickListReserve = 4096 # entries reserved per CUDA kick interaction list at block start; 0 grows on demand

[checkpoint]
readIndex = -1 # checkpoint index to restart; -1 starts a new run
intervalSeconds = 1000000000 # elapsed wall time between checkpoints, in seconds

[initial]
gadget4Restart =  # Gadget4 input file for power-spectrum analysis
useGlass = false # initialize from a glass file
createGlass = false # deprecated selector; use run.scenario=glass
plummer = false # deprecated selector; use run.scenario=plummer
plummerRadius = 0.01 # Plummer radius
closePack = false # use a close-packed particle lattice
twoLpt = false # use second-order Lagrangian initial conditions
particlesPerDimension = 32 # particle lattice size along each dimension, per species

[analysis]
power = false # compute the mass power spectrum
groups = false # find particle groups
tracers = false # write tracer particles to Silo
tracerCount = 1000000 # number of tracer particles
slice = false # write a projected slice through the volume
views = false # write instantaneous HEALPix maps
viewSize = 1024 # view HEALPix Nside
sliceResolution = 4096 # slice resolution

[output]
silo = true # write particle Silo files for the configured box
siloInterval = 1 # number of synchronized coarse steps between particle Silo snapshots
directory = ./output/sod # directory for all generated simulation output
units = code # particle Silo units: code, cgs, cosmological, or both (cgs and cosmological)
frame = comoving # particle Silo frame: comoving, lab, or both; converted velocities are peculiar
xMin = 0.0 # minimum x coordinate of the Silo box, in [0, 1]
xMax = 1.0 # maximum x coordinate of the Silo box, in [0, 1]
yMin = 0.0 # minimum y coordinate of the Silo box, in [0, 1]
yMax = 1.0 # maximum y coordinate of the Silo box, in [0, 1]
zMin = 0.0 # minimum z coordinate of the Silo box, in [0, 1]
zMax = 1.0 # maximum z coordinate of the Silo box, in [0, 1]

[lightcone]
enabled = false # enable lightcone analysis
directory = ./output/sod/lightcone # directory for lightcone output
linkingLength = 0.28 # lightcone group-finder linking length
mapSize = -1 # lightcone HEALPix Nside; -1 chooses automatically

[gravity]
kernelFamily = ferrers # spline, wendland, or ferrers
kernelDegree = 4 # density degree: spline 3..9; wendland 2,5,8; ferrers 2,4,6,8
enabled = false # enable self-gravity
fmmOrder = 7 # FMM order (multipole degree plus two), 3 to 9; every order is compiled in
openingAngle = 0.8 # gravity tree opening angle; run.test=force uses its own sweep
openLargerCell = true # tree walk opens only the larger of two rejected cells instead of both
softening = 0.018769884569535343 # legacy effective-radius alias, 2 sigma in initial reference spacings
# Fixed comoving radius; comment out softening to choose an alternative below.
# effectiveRadius = 0.018769884569535343 # effective radius (2 sigma), in initial reference spacings
# supportRadius = 0.028154826854303015 # support radius, in initial reference spacings; equivalent for Ferrers degree 4
timestepEta = 0.20401599335954482 # prefactor C in dt = C sqrt(effectiveRadius/acceleration), effectiveRadius = 2 sigma

[cosmology]
startRedshift = 49.0 # starting redshift
endRedshift = 0.0 # ending redshift
omegaLambda = -1.0 # dark-energy density parameter; negative chooses a flat universe
omegaB = 0.049389 # baryon density parameter
omegaC = 0.26503 # cold-dark-matter density parameter
nEff = 3.046 # effective number of neutrino species
thetaCmb = 0.9983516483516482 # CMB temperature divided by 2.73 K
heliumFraction = 0.2454006 # primordial helium mass fraction
sigma8 = 0.8607 # power-spectrum normalization
hubble = 0.6732 # dimensionless Hubble parameter
spectralIndex = 0.96605 # primordial spectral index

[units]
massSolar = 1485442661.9132502 # particle mass unit in solar masses

[hydro]
kernelFamily = spline # independent of gravity.kernelFamily
kernelDegree = 3 # density degree: spline 3..9; wendland 2,5,8; ferrers 2,4,6,8
enabled = true # enable density/internal-energy SPH
yAcceleration = 0.0 # uniform gravitational acceleration in the y direction
zPlaneAcceleration = 0.0 # nonnegative acceleration magnitude toward z=0.5
viscosityAlpha = 1.0 # constant linear artificial-viscosity coefficient alpha
viscosityBeta = 2.0 # constant quadratic artificial-viscosity coefficient beta
viscosityEpsilon = 0.01 # viscosity regularization relative to sqrt(5/6) times the effective radius
balsaraSwitch = true # suppress artificial viscosity in shear flows
gamma = 1.6666666666666667 # ideal-gas adiabatic index
centralAcceleration = 0.0 # magnitude of the central force
centralSoftening = 0.0054772255750516604 # legacy central effective-radius alias (2 sigma), in box units; gravity kernel
# Comment out centralSoftening before selecting one alternative below.
# centralEffectiveRadius = 0.0054772255750516604 # central-force effective radius (2 sigma), in box units
# centralSupportRadius = 0.0082158383625774902 # central-force support radius, in box units; equivalent for Ferrers degree 4
minSupportRadius = 1e-06 # minimum support radius in initial interparticle spacings
# Replace minSupportRadius with this alternative to supply an effective-radius bound.
# minEffectiveRadius = 5.4772255750516605e-07 # minimum effective radius (2 sigma), in initial interparticle spacings; cubic equivalent
maxSupportRadius = 1000.0 # maximum support radius in initial interparticle spacings; capped at half the box
# Replace maxSupportRadius with this alternative to supply an effective-radius bound.
# maxEffectiveRadius = 547.72255750516604 # maximum effective radius (2 sigma), in initial interparticle spacings; cubic equivalent
neighborNumber = 42 # kernel-weighted neighbor target within the support sphere, including self
cfl = 0.22821773229381923 # Courant time-step factor using effective radius = 2 sigma

[chemistry]
enabled = false # evolve primordial thermochemistry (requires hydro.enabled)
network = atomic6 # atomic6 or molecular9; optically thin low-density gas
initialization = recombination # native initial T/ion fractions; manual uses fixed defaults
radiationFile =  # optional versioned redshift/photo-rate table; empty means no imposed UV
synchronizedRung = 4 # fixed common timestep rung; fail if hydro/gravity requires a finer step
# initialTemperature = 1000.0 # initial gas temperature in kelvin
# hydrogenIonFraction = 0.0002 # initial H+ fraction per H nucleus
# heliumIonFraction = 0.0 # initial He+ fraction per He nucleus
# heliumDoubleIonFraction = 0.0 # initial He++ fraction per He nucleus
hydrogenMinusFraction = 0.0 # initial H- fraction per H nucleus
molecularFraction = 0.0 # initial fraction of H nuclei in H2
molecularIonFraction = 0.0 # initial fraction of H nuclei in H2+
relativeTolerance = 0.0001 # local relative source tolerance (minimum 1e-5); not a global error guarantee
abundanceAbsoluteTolerance = 1e-12 # absolute fractional-nuclei tolerance
energyAbsoluteTolerance = 1e-08 # absolute thermal-energy tolerance, eV per H nucleus
maxSubsteps = 4096 # maximum accepted source substeps per half step
