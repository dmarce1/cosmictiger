# Flat Lambda CDM evolved to the expanding a=1 present.
# Recreates the historical present-day use case with current massless radiation.
# Current model present age is 13811457113.336395 years.
# sigma8=0.8607 uses the current native initial-power solver.
# Gas and dark-matter run with starting z=49; resolution is set below.
# The comoving box size is derived from the reference mass and resolution.
# All application options are retained; CLI --group.key overrides the INI.
# 99 synchronized coarse intervals and siloInterval=1 request 100 snapshots,
# including the initial and final state, at equal conformal-time intervals.
# Uses the current radiation model: photons plus nEff=3.046 MASSLESS neutrinos.
# No historical massive-neutrino density is folded into the cold matter.
# Current force and softening defaults are retained from cosmology.ini.
# run.endTime is a conformal code duration, with time unit boxLength/c.
# At fixed box and cosmology, changing resolution requires massSolar *= (N_old/N_new)^3.
# Changing the box or cosmological parameters requires recomputing duration.
# Historical use-case provenance: dmarce1/experimental at
# 7ba8f1829fdede7348a1418b7cb36c0e7a955302, configs/evolution/.

[run]
timeIntegrator = traditional # traditional, hierarchical (gravity only), or global (raw minimum dt)
verbose = false # print detailed runtime diagnostics
endTime = 0.0 # cosmology: conformal code duration overrides endRedshift; 0 uses scenario default
scenario = cosmology # cosmology, glass, plummer, sod, blast, rayleighTaylor, kelvinHelmholtz, disc, polytropicStar, hydroWave, gresho; requires compiled physics
test =  # developer regression name; physical simulations use run.scenario
maxIterations = 1000000 # maximum number of time steps
numberOfSteps = 99 # total synchronized coarse intervals across the scenario
minRung = 0 # minimum starting rung
rungMergeFraction = 0.3333333333333333 # hierarchical: merge the lowest occupied rung into the next when finer rungs hold more than this fraction of the particles on or above it (GADGET-4: N1 > N0/3); 1 never merges
# Force-test-only tree reuse control; ignored unless run.test=force.
# 0 rebuilds the tree at each kick angle from 0.2 to 0.95 (step 0.05).
# A positive value <= 0.95 builds once there and sweeps kick angles up to 0.95 (step 0.025).
treeOpeningAngle = 0.0 # does not enable or disable FMM

[compute]
# positionType = fixed32 # fixed32 or fixed64; optional; defaults to compiled width and must match COSMICTIGER_POSITION_TYPE
bucketSize = 128 # gravity tree leaf bucket size
sphBucketSize = 0 # SPH leaf limit; 0 uses floor(8/pi * hydro.neighborNumber), 106 for 42 neighbors
sphTreeRebuildFraction = 0.3333333333333333 # Rebuild when this fraction of all particles is active

[drift]
cuda = true # use CUDA for particle drifts

[sort]
cuda = false # CUDA sorting is not implemented

[checkpoint]
readIndex = -1 # checkpoint index to restart; -1 starts a new run
intervalSeconds = 1000000000 # elapsed wall time between checkpoints, in seconds

[initial]
cuda = false # use CUDA for sphere initial conditions
gadget4Restart =  # Gadget4 input file for power-spectrum analysis
useGlass = false # initialize from a glass file
plummerRadius = 0.01 # Plummer radius
closePack = false # use a close-packed particle lattice
twoLpt = false # use second-order Lagrangian initial conditions
particlesPerDimension = 32 # particle lattice size along each dimension, per species

[analysis]
power.cuda = false # use CUDA for power-spectrum particle assignment
groups.cuda = false # use CUDA for halo-group analysis
tracers.cuda = false # CUDA tracer output is not implemented
slice.cuda = false # CUDA slice output is not implemented
views.cuda = false # CUDA view output is not implemented
saveForce = false # legacy shorthand retaining both acceleration and potential
saveAcceleration = false # retain per-particle acceleration diagnostics
savePotential = false # retain per-particle potential diagnostics
power = false # compute the mass power spectrum
groups = false # find particle groups
tracers = false # write tracer particles to Silo
tracerCount = 1000000 # number of tracer particles
slice = false # write a projected slice through the volume
views = false # write instantaneous HEALPix maps
viewSize = 1024 # view HEALPix Nside
sliceResolution = 4096 # slice resolution

[output]
silo = true # write particle Silo files for the configured box
siloInterval = 1 # number of synchronized coarse steps between particle Silo snapshots
directory = ./output/lcdm_present # directory for all generated simulation output
units = code # particle Silo units: code, cgs, cosmological, or both (cgs and cosmological)
frame = comoving # particle Silo frame: comoving, lab, or both; converted velocities are peculiar
xMin = 0.0 # minimum x coordinate of the Silo box, in [0, 1]
xMax = 1.0 # maximum x coordinate of the Silo box, in [0, 1]
yMin = 0.0 # minimum y coordinate of the Silo box, in [0, 1]
yMax = 1.0 # maximum y coordinate of the Silo box, in [0, 1]
zMin = 0.0 # minimum z coordinate of the Silo box, in [0, 1]
zMax = 1.0 # maximum z coordinate of the Silo box, in [0, 1]

[lightcone]
cuda = false # use CUDA for lightcone group analysis
enabled = false # enable lightcone analysis
directory = ./output/lcdm_present/lightcone # directory for lightcone output
linkingLength = 0.28 # lightcone group-finder linking length
mapSize = -1 # lightcone HEALPix Nside; -1 chooses automatically

[gravity]
cuda = true # use CUDA for gravitational forces
error.cuda = true # use CUDA for sampled direct-force checks
cuda.kickFineHandoffBlocks = 0 # handoff divisor for nodes without Ewald checks; 0 retains cuda.kickHandoffBlocks
cuda.kickResidency = 0 # resident CUDA kick blocks per multiprocessor; 0 uses the register limit
cuda.kickSinkTile = 0 # CUDA kick shared sink-force tile; 0 automatic, -1 global force storage
cuda.kickParticleTile = 0 # CUDA kick staged particle sources per tile; 0 automatic
cuda.kickMultipoleTile = 0 # CUDA kick staged multipoles per tile; 0 automatic
cuda.kickSharedExpansion = true # keep the active CUDA kick local expansion in shared memory
cuda.kickHandoffBlocks = 0 # CUDA block count dividing the particles for the CPU/GPU handoff threshold; 0 derives it from the particle count
cuda.kickListReserve = 4096 # entries reserved per CUDA kick interaction list at block start; 0 grows on demand
errorInterval = 8 # direct-force comparisons every N coarse steps; 0 disables
errorSampleSize = 100 # evenly spaced global particles, capped at particle count
# Select a gravity method from those compiled into the executable:
# FMM: method.far=fmm; leave method.near commented.
# PMMM-PP: method.far=pmmm and method.near=pp (direct particle pairs).
# PMMM-FMM: method.far=pmmm and method.near=fmm (FMM near field).
# PM: method.far=pm (mesh gravity alone, mandatory outer PM interval).
# PP-PM: method.far=p3m and method.near=pp; FMM-PM: method.far=p3m and method.near=fmm.
method.far = fmm # fmm, pmmm, pm, or p3m (compiled solvers); none requires enabled=false
# method.near = pp # PMMM or P3M only: pp or fmm; required if both are compiled
# expansionDegree = 6 # potential degree; defaults to the largest compiled degree (normally 6)
# PMMM requires a power-of-two meshSize >= 2*pmmmNearWidth+1.
meshSize = 16
# Coarsest PMMM stage mesh and particle-domain cut granularity, a power of two;
# 0 selects meshSize/8 (never below the smallest power of two >= 2*pmmmNearWidth+1).
pmmmCoarseMeshSize = 0
# PMMM ghost/neighbor cube radius in cells: 1 through 4. Ignored by fmm.
pmmmNearWidth = 1
pmmmBatchParticles = 4096 # target sinks per ready FMM batch; larger cells run whole
# Particle-mesh (pm, p3m) assignment/interpolation cloud: ngp, cic, tsc, or pcs.
cloud = pcs
# P3M Gaussian split radius r_s in mesh cells and the short-range pair cutoff in r_s.
p3mSplitCells = 1.25
p3mCutoff = 4.5
kernelFamily = ferrers # spline, wendland, or ferrers
kernelDegree = 4 # density degree: spline 2..9; wendland 2,5,8; ferrers 2,4,6,8
enabled = true # enable self-gravity
# Global FMM uses openingAngle unless an openingSchedule is configured.
openingAngle = 0.8 # gravity tree opening angle; run.test=force uses its own sweep
openingSchedule = # global FMM cosmology z:theta pairs; empty keeps openingAngle
openLargerCell = true # tree walk opens only the larger of two rejected cells instead of both
softening = 0.018769884569535343 # legacy effective-radius alias, 2 sigma in initial reference spacings
# Fixed comoving radius; comment out softening to choose an alternative below.
# effectiveRadius = 0.018769884569535343 # effective radius (2 sigma), in initial reference spacings
# smoothingLength = 0.028154826854303015 # support radius, in initial reference spacings; equivalent for Ferrers degree 4
timestepEta = 0.20401599335954482 # prefactor C in dt = C sqrt(effectiveRadius/acceleration), effectiveRadius = 2 sigma

[cosmology]
startRedshift = 49.0 # starting redshift
endRedshift = 0.0 # expanding endpoint when run.endTime=0
omegaLambda = auto # signed density parameter; auto closes flat budget; numeric values must also be flat
omegaB = 0.049309230511847414 # baryon density parameter
omegaC = 0.26415659202775399 # cold-dark-matter density parameter
nEff = 3.046 # effective number of neutrino species
thetaCmb = 0.9983516483516482 # CMB temperature divided by 2.73 K
heliumFraction = 0.245 # primordial helium mass fraction
sigma8 = 0.8607 # power-spectrum normalization
hubble = 0.67400000000000004 # dimensionless Hubble parameter
spectralIndex = 0.965 # primordial spectral index

[units]
massSolar = 3.58e9 # reference particle mass in solar masses, without /h
# Choose either massSolar or boxLength, including across CLI/INI inputs.
# boxLength = 100.0 # comoving box side in Mpc/h; replace massSolar above to use

[hydro]
cuda = true # use CUDA for SPH
method = sph # sph
kernelFamily = spline # spline, wendland, or ferrers; independent of gravity.kernelFamily
kernelDegree = 3 # density degree: spline 2..9; wendland 2,5,8; ferrers 2,4,6,8
enabled = true # enable density/internal-energy SPH
yAcceleration = 0.0 # uniform gravitational acceleration in the y direction
zPlaneAcceleration = 0.0 # nonnegative acceleration magnitude toward z=0.5
viscosityAlpha = 1.0 # linear artificial-viscosity coefficient alpha when viscosityEvolution=none
viscosityBeta = 2.0 # quadratic coefficient beta; multiplies alpha for morrisAndMonaghan and cullenAndDehnen, constant for none and priceEtAl
viscosityEpsilon = 0.01 # viscosity regularization relative to sqrt(5/6) times the effective radius
# balsaraSwitch = true # optional override: default on for constant/MM, off for CD/Hu/Price
viscosityEvolution=hu_etal # none, morrisAndMonaghan, cullenAndDehnen, priceEtAl, or hu_etal
viscosityAlphaMin=0.1
viscosityDecay=0.2
viscosityAlphaMax=2
viscosityDecayCD=0.05
viscosityAlphaMaxPrice=1
viscosityDecayPrice=0.1
viscosityAlphaMaxHu=1
viscosityDecayHu=0.05
gamma = 1.6666666666666667 # ideal-gas adiabatic index
centralAcceleration = 0.0 # magnitude of the central force
centralSoftening = 0.0054772255750516604 # legacy central effective-radius alias (2 sigma), in box units; gravity kernel
# Comment out centralSoftening before selecting one alternative below.
# centralEffectiveRadius = 0.0054772255750516604 # central-force effective radius (2 sigma), in box units
# centralSmoothingLength = 0.0082158383625774902 # central-force support radius, in box units; equivalent for Ferrers degree 4
minSmoothingLength = 1e-06 # minimum support radius in initial interparticle spacings
# Replace minSmoothingLength with this alternative to supply an effective-radius bound.
# minEffectiveRadius = 5.4772255750516605e-07 # minimum effective radius (2 sigma), in initial interparticle spacings; cubic equivalent
maxSmoothingLength = 1000.0 # maximum support radius in initial interparticle spacings; capped at half the box
# Replace maxSmoothingLength with this alternative to supply an effective-radius bound.
# maxEffectiveRadius = 547.72255750516604 # maximum effective radius (2 sigma), in initial interparticle spacings; cubic equivalent
neighborNumber = 42 # kernel-weighted neighbor target within the support sphere, including self
cfl = 0.22821773229381923 # Courant time-step factor using effective radius = 2 sigma

[chemistry]
cuda = true # use CUDA for equilibrium cooling
enabled = true # GADGET-4 equilibrium atomic cooling
initializationTemperature = 10000 # kelvin; zero preserves initial-condition energy
minimumSpecificEnergy = 0 # minimum physical specific thermal energy, erg/g

[starFormation]
cuda = true # use CUDA for star formation
enabled = true
beta = 0.1
evaporationFactor = 1000
starFormationTimeGyr = 2.1
coldTemperature = 1000
supernovaTemperature = 1e8
seed = 42
criticalPhysicalDensity = 0 # H nuclei/cm^3; zero derives the GADGET-4 threshold
criticalOverDensity = 57.7 # threshold relative to mean comoving baryon density
