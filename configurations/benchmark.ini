# Particle input paths are absolute; this configuration can be run from any directory.
# Targets z=20,2,0 select snapshots strictly above each target:
# view.0.2.silo: z=22.6499379613608
# view.0.13.silo: z=2.18800951546296
# view.0.23.silo: z=0.117408174187551
[run]
scenario = benchmark

[benchmark]
testFiles = /home/dmarce1/workspace/cosmictiger/configurations/benchmark/particles_z0.txt, /home/dmarce1/workspace/cosmictiger/configurations/benchmark/particles_z2.txt, /home/dmarce1/workspace/cosmictiger/configurations/benchmark/particles_z20.txt
openingAngles = 0.7, 0.55, 0.4
size = 8
repeats = 10

[gravity]
cuda = true

[output]
silo = false
directory = ./output/benchmark
