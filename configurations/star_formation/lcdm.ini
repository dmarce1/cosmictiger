# Equilibrium SH03 with primordial thermochemistry.
# Requires COSMICTIGER_ENABLE_STARS=ON, COSMICTIGER_ENABLE_CHEMISTRY=ON, and SPH.
# No UV background or metal-line cooling is supplied; see docs/star_formation.md.
[run]
scenario = cosmology
timeIntegrator = traditional

[compute]
cuda = false

[initial]
particlesPerDimension = 32

[gravity]
enabled = true
method.far = fmm

[hydro]
enabled = true
gamma = 1.6666666666666667

[chemistry]
enabled = true

[starFormation]
enabled = true
beta = 0.1
evaporationFactor = 1000
starFormationTimeGyr = 2.1
coldTemperature = 1000
supernovaTemperature = 1e8
seed = 1
metalYield = 0.02
winds = false
windMassLoading = 2
windEnergyFraction = 0.25
windDecouplingMyr = 50
windRecoupleDensityFraction = 0.1
windDirection = isotropic

[output]
directory = ./output/star_formation
silo = true
